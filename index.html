<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Games 'R Us!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1 class="text-center my-4">Retro Games!</h1>
        <!-- Used a 2 * 5 grid for 10 products-->
        <div class="row">
            <div class="col-6 product">
                <div class="product-image">
                    <img src="CV1_NES.jpg"
                    alt="Castlevania [NES]"
                    class="img-fluid">
                    <span class="price">$59.99</span>
                </div>
                <h3>Castlevania</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="Sonic1.webp"
                    alt="Sonic the Hedgehog [GEN]"
                    class="img-fluid">
                    <span class="price">$54.99</span>
                </div>
                <h3>Sonic the Hedgehog</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="Sonic2JP.jpg"
                    alt="Sonic the Hedgehog 2 [GEN]"
                    class="img-fluid">
                    <span class="price">$64.99</span>
                </div>
                <h3>Sonic the Hedgehog 2</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="Super_Metroid.jpeg"
                    alt="Super Metroid [SNES]"
                    class="img-fluid">
                    <span class="price">$69.99</span>
                </div>
                <h3>Super Metroid</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="ChronoTrigger.jpg"
                    alt="Chrono Trigger [SNES]"
                    class="img-fluid">
                    <span class="price">$119.99</span>
                </div>
                <h3>Chrono Trigger</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="StarFox64.jpg"
                    alt="Star Fox 64 [N64]"
                    class="img-fluid">
                    <span class="price">$74.99</span>
                </div>
                <h3>Star Fox 64</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="ZeldaMM_64.jpg"
                    alt="The Legend of Zelda: Majora's Mask [N64]"
                    class="img-fluid">
                    <span class="price">$99.99</span>
                </div>
                <h3>tLoZ: Majora's Mask</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="PK_Emerald.jpg"
                    alt="Pokémon - Emerald Version [GBA]"
                    class="img-fluid">
                    <span class="price">$164.99</span>
                </div>
                <h3>Pokémon Emerald Version</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="FF1&2_GBA.jpg"
                    alt="FINAL FANTASY I & II: Dawn of Souls [GBA]"
                    class="img-fluid">
                    <span class="price">$79.99</span>
                </div>
                <h3>FF I & II: Dawn of Souls</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>

            <div class="col-6 product">
                <div class="product-image">
                    <img src="NSMBDS.jpeg"
                    alt="New Super Mario Bros. [NDS]"
                    class="img-fluid">
                    <span class="price">$39.99</span>
                </div>
                <h3>New Super Mario Bros.</h3>
                <button type="button"
                class="btn btn-primary">Buy</button>
            </div>
        </div>
    </div>
    <!-- FOOTER SECTION: Form for signup + company logo-->
    <footer class="site-footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <form class="signup-form">
                        <div class="form-group">
                            <label for="customerName">Name</label>
                            <input type="text"
                            id="customerName"
                            class="form-control"
                            placeholder="Your name">
                        </div>

                        <div class="form-group">
                            <label for="customerEmail">Email</label>
                            <input type="email"
                            id="customerEmail"
                            class="form-control"
                            placeholder="Your email">
                        </div>

                        <button type="button" 
                        class="btn btn-success">Sign Up</button>
                    </form>
                </div>

                <div class="col-md-4">
                    <img src="Nintendo_Logo.png"
                    alt="Fake Company Logo"
                    class="img-fluid">
                </div>
                </div>
            </div>
        </div>
    </footer>

        <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
</body>
</html>
